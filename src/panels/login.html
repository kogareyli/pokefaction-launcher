<div class="container connexion">
    <div class="connexion-fond" aria-hidden="true"></div>
    <img class="connexion-logo" src="assets/images/logo/logo.png" alt="PokéFaction" />

    <div class="login-pokefaction login-tabs">
        <!-- Compte PokéFaction (pseudo + mot de passe) : s'ouvre au-dessus de la barre -->
        <div class="pf-carte">
            <div class="pf-onglets">
                <button class="pf-onglet pf-onglet-connexion pf-onglet-actif">J'ai un compte</button>
                <button class="pf-onglet pf-onglet-inscription">Créer un compte</button>
            </div>
            <form class="pf-formulaire" autocomplete="off">
                <input type="text" class="pf-champ pf-pseudo" placeholder="Pseudo" maxlength="16" spellcheck="false" />
                <input type="password" class="pf-champ pf-mdp" placeholder="Mot de passe" />
                <input type="password" class="pf-champ pf-mdp2" placeholder="Confirme le mot de passe" />
                <div class="pf-aide">Ce sera ton pseudo en jeu : 3 à 16 lettres, chiffres ou _</div>
                <div class="pf-erreur"></div>
                <div class="login-options">
                    <button type="submit" class="connect pf-valider">Se connecter</button>
                    <button type="button" class="cancel cancel-pokefaction" style="display: none;">Annuler</button>
                </div>
            </form>
        </div>

        <div class="connexion-barre">
            <span class="connexion-langue" title="Français">FR</span>
            <button class="pf-microsoft">
                <span class="pf-ms-logo"><i></i><i></i><i></i><i></i></span>
                Se connecter avec Microsoft
            </button>
            <button type="button" class="pf-ouvrir-compte">Compte PokéFaction</button>
            <label class="connexion-rester"><input type="checkbox" class="pf-rester" checked /> <span>Rester connecté</span></label>
            <span class="connexion-discord" title="Membres du Discord">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029z"/></svg>
                <b class="discord-membres">–</b>
            </span>
        </div>
        <div class="connexion-copyright">© 2026 PokéFaction · <span class="connexion-version"></span></div>
    </div>

    <div class="login-home login-tabs">
        <div class="login-text">Veuillez vous identifier afin de jouer.</div>
        <div class="login-options">
            <button class="connect connect-home">Connexion</button>
            <button class="cancel cancel-home" style="display: none;">annuler</button>
        </div>
    </div>

    <div class="login-offline login-tabs">
        <div class="login-text">Veuillez entrer votre pseudo</div>
        <div class="input-login">
            <input type="text" class="email email-offline" placeholder="Pseudo" />
        </div>
        <div class="login-options">
            <button class="connect connect-offline">Connexion</button>
            <button class="cancel cancel-offline" style="display: none;">annuler</button>
        </div>
    </div>

    <div class="login-AZauth login-tabs">
        <div class="login-text">Veuillez vous connecter afin de jouer.</div>
        <div class="input-login">
            <input type="text" class="email email-AZauth" placeholder="E-mail" />
            <input type="password" class="password password-AZauth" placeholder="Password" />
        </div>
        <div class="login-options">
            <button class="connect connect-AZauth">Connexion</button>
            <button class="cancel cancel-AZauth" style="display: none;">annuler</button>
        </div>
    </div>

    <div class="login-AZauth-A2F login-tabs">
        <div class="login-text">Veuillez entrer le code de sécurité.</div>
        <div class="input-login">
            <input type="text" class="A2F A2F-AZauth" placeholder="Code" />
        </div>
        <div class="login-options">
            <button class="connect connect-AZauth-A2F">Valider</button>
            <button class="cancel cancel-AZauth-A2F">annuler</button>
        </div>
    </div>
</div>
