<div class="container accueil">
    <section class="accueil-haut">
        <div class="accueil-logo">
            <img class="accueil-logo-img" src="assets/images/logo/logo.png" alt="PokéFaction" />
        </div>

        <div class="play-elements">
            <div class="play-cadre">
                <div class="play-instance">
                    <button class="play-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.6-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg>
                        <span>Jouer</span>
                    </button>
                    <div class="instance-select icon-arrow"></div>
                </div>
            </div>
            <div class="info-starting-game">
                <div class="info-ligne">
                    <span class="info-starting-game-text">Connexion...</span>
                    <span class="info-pourcent"></span>
                </div>
                <div class="barre"><progress value="0" max="0" class="progress-bar"></progress><div class="barre-remplie"></div></div>
            </div>
        </div>
    </section>

    <!-- Actualités : une grande carte « À la une » et les suivantes en petit -->
    <section class="actus news-list"></section>

    <div class="article-ouvert">
        <article class="article-carte">
            <button class="article-fermer" aria-label="Fermer">×</button>
            <div class="article-image"></div>
            <div class="article-corps">
                <span class="article-date"></span>
                <h2 class="article-titre"></h2>
                <div class="article-texte"></div>
                <div class="article-auteur"></div>
            </div>
        </article>
    </div>

    <div class="instance-popup">
        <div class="instances-tab">
            <div class="close-popup icon-close"></div>
            <p>Choisis ton instance</p>
            <div class="instances-List"></div>
        </div>
    </div>
</div>
