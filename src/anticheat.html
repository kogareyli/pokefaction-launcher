<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>PokéFaction Anti-Cheat</title>
<link rel="stylesheet" href="assets/css/font.css">
<style>
  /* Fenêtre « PokéFaction Anti-Cheat » (4.3) : s'ouvre au clic sur Jouer, analyse le jeu, puis laisse la place au jeu. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 26px 30px 24px;
    background: radial-gradient(90% 70% at 78% -14%, #1b1a17 0%, rgba(27, 26, 23, 0) 70%), #0a0a0b;
    border: 1px solid rgba(255, 255, 255, .09);
    color: #f2f2f0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
  }
  .tete { display: flex; align-items: center; gap: 12px; width: 100%; }
  .tete img { width: 46px; height: auto; }
  .titre { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
  .sous { font-size: 11.5px; color: rgba(242, 242, 240, .5); margin-top: 1px; }
  .bouclier { margin-left: auto; width: 26px; height: 26px; }
  .bouclier path { fill: none; stroke: #f5b50c; stroke-width: 1.8; }
  .bouclier .coche { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .4s ease .1s; }
  body.ok .bouclier .coche { stroke-dashoffset: 0; }
  .etape { width: 100%; font-size: 13px; font-weight: 600; min-height: 18px; color: rgba(242, 242, 240, .85); }
  .barre { width: 100%; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .barre div { height: 100%; width: 0; border-radius: 6px; background: #f2b112; transition: width .35s ease; }
  .liste { width: 100%; margin: 0; padding: 0; list-style: none; font-size: 11.5px; color: rgba(242, 242, 240, .55); min-height: 54px; }
  .liste li { display: flex; gap: 7px; align-items: baseline; margin: 2px 0; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
  .liste li.vu { opacity: 1; transform: none; }
  .liste li::before { content: '✔'; color: #5fd39a; font-size: 10px; }
  .liste li.corrige::before { content: '!'; color: #f5b50c; font-weight: 800; }
  .pied { width: 100%; font-size: 10.5px; color: rgba(242, 242, 240, .35); text-align: center; }
</style>
</head>
<body>
  <div class="tete">
    <img src="assets/images/logo/logo-96.png" srcset="assets/images/logo/logo-96.png 1x, assets/images/logo/logo-144.png 1.5x, assets/images/logo/logo-200.png 2x" alt="">
    <div>
      <div class="titre">PokéFaction Anti-Cheat</div>
      <div class="sous">Analyse de ton jeu avant de lancer Minecraft</div>
    </div>
    <svg class="bouclier" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path class="coche" d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>
  </div>
  <div class="etape" id="etape">Démarrage de l'analyse…</div>
  <div class="barre"><div id="barre"></div></div>
  <ul class="liste" id="liste"></ul>
  <div class="pied">Les tricheurs sont expulsés, puis bannis par le staff.</div>
<script>
  const { ipcRenderer } = require('electron');
  const $ = id => document.getElementById(id);
  ipcRenderer.on('anticheat-progres', (e, p) => {
    if (p.texte) $('etape').textContent = p.texte;
    if (typeof p.pct === 'number') $('barre').style.width = Math.max(2, Math.min(100, p.pct)) + '%';
    if (p.fait) {
      const li = document.createElement('li');
      li.textContent = p.fait;
      if (p.corrige) li.className = 'corrige';
      $('liste').append(li);
      requestAnimationFrame(() => li.classList.add('vu'));
      while ($('liste').children.length > 4) $('liste').firstElementChild.remove();
    }
    if (p.fin) {
      document.body.classList.add('ok');
      $('barre').style.width = '100%';
    }
  });
</script>
</body>
</html>
